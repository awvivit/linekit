name: Bug report
description: Report a defect in the Linekit site or repository
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 143, Chrome 141, Safari 26
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Extra context. Leave out images you consider private; Linekit is intended to keep images in the browser.
    validations:
      required: false
